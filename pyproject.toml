[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corecoder-rl"
version = "0.1.0"
description = "CoreCoder teacher-student RL integration built on CoreCoder_RL/slime."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "CoreCoder_RL contributors"}]
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "numpy>=1.26",
  "pandas>=2.0",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["corecoder_rl*"]
